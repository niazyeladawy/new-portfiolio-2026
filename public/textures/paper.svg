<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!--
    Paper grain. Referenced once, globally, from body::before in globals.css —
    never per-component (see MASTER.md forbidden patterns).

    Two turbulence passes: a fine one for the fibre speckle and a coarse one
    for the slow blotching real paper has. Both are desaturated and pushed to
    the light end so that, under `mix-blend-mode: multiply`, the sheet only
    ever darkens the ivory ground slightly instead of greying it out.
  -->
  <defs>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" seed="7" />
      <feColorMatrix type="saturate" values="0" />
      <!-- compress into the 0.82–1.0 band: visible tooth, no visible dirt -->
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.18" intercept="0.82" />
        <feFuncG type="linear" slope="0.18" intercept="0.82" />
        <feFuncB type="linear" slope="0.18" intercept="0.82" />
        <feFuncA type="linear" slope="0" intercept="1" />
      </feComponentTransfer>
    </filter>

    <filter id="blotch" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" stitchTiles="stitch" seed="19" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.1" intercept="0.9" />
        <feFuncG type="linear" slope="0.1" intercept="0.9" />
        <feFuncB type="linear" slope="0.1" intercept="0.9" />
        <feFuncA type="linear" slope="0" intercept="1" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="360" height="360" filter="url(#blotch)" />
  <rect width="360" height="360" filter="url(#fibre)" style="mix-blend-mode:multiply" />
</svg>
